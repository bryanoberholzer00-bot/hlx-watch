# Compila l'app Android di HLX Watch (una WebView sul sito) e la pubblica come release del repository.
# L'APK si scarica da: https://github.com/<utente>/hlx-watch/releases/download/android-latest/hlx-watch.apk
#
# Segreti: ANDROID_KEYSTORE_B64 (chiave PKCS12 in base64) e ANDROID_KEYSTORE_PASSWORD.
# La stessa chiave firma ogni versione: così l'app si aggiorna installando l'APK nuovo sopra il vecchio.

name: App Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepara la chiave di firma
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release-key.p12"

      - name: Compila l'APK firmato
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verifica la firma
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          cp "$APK" hlx-watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hlx-watch-apk
          path: hlx-watch.apk

      - name: Pubblica la release android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="App Android di HLX Watch, build ${{ github.run_number }} ($(date -u +'%Y-%m-%d %H:%M') UTC). Installa l'APK sopra la versione precedente per aggiornare."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest hlx-watch.apk --clobber
            gh release edit android-latest --title "HLX Watch per Android (build ${{ github.run_number }})" --notes "$NOTES"
          else
            gh release create android-latest hlx-watch.apk --title "HLX Watch per Android (build ${{ github.run_number }})" --notes "$NOTES" --latest
          fi
