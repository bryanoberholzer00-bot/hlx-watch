# Storia dei progetti Valve: una volta sola, a mano. Clona gli archivi SteamTracking (Dota 2 pesa quasi 7 GB, troppo
# per un PC) e cerca la prima comparsa dei nomi in codice prima dell'annuncio:
#   alyx-storia      -> alyx_seed.json     (Half-Life: Alyx, nomi hlvr)
#   progetti-storia  -> progetti_seed.json (Deadlock, Counter-Strike 2, Steam Deck, Steam Frame...)
# Il risultato si scarica dagli artifact del run e si salva nel repository: è storia chiusa.

name: Storia dei progetti Valve

on:
  workflow_dispatch:
    inputs:
      comando:
        description: "Cosa raccogliere"
        type: choice
        options: [progetti-storia, alyx-storia]
        default: progetti-storia
      filtro:
        description: "Solo questi (alyx-storia: archivi; progetti-storia: progetti), separati da virgola; vuoto = tutti"
        default: ""

permissions:
  contents: read

jobs:
  storia:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Prima comparsa dei nomi in codice
        env:
          COMANDO: ${{ github.event.inputs.comando }}
          FILTRO: ${{ github.event.inputs.filtro }}
        run: |
          FLAG=--repo; [ "$COMANDO" = "progetti-storia" ] && FLAG=--progetto
          ARGS=""
          for r in ${FILTRO//,/ }; do ARGS="$ARGS $FLAG $r"; done
          python -m hlxwatch "$COMANDO" --workdir "$RUNNER_TEMP/storia" --out storia.json $ARGS

      - uses: actions/upload-artifact@v7
        with:
          name: storia
          path: storia.json
