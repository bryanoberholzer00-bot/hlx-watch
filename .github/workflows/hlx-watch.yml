# HLX Watch su GitHub Actions: scansione periodica e report giornaliero,
# senza un PC acceso. Il database SQLite sopravvive tra un run e l'altro grazie
# alla cache di Actions e viene anche pubblicato come artifact scaricabile.
#
# NOTA sui cron di GitHub: vengono ritardati o saltati sotto carico (anche di ore).
# Per questo il report giornaliero non è legato a un orario: ogni run pianificato lo manda
# se non è ancora stato mandato oggi ed è passata l'ora in config (general.daily_report_time, UTC).
#
# Segreti da impostare nel repository (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID      (oppure DISCORD_WEBHOOK_URL)
#   GH_PAT            opzionale: token personale GitHub (5000 req/ora); senza, usa quello
#                     automatico di Actions (1000 req/ora), sufficiente per le scansioni
#   STEAM_WEB_API_KEY opzionale: lista completa delle app Steam
#   ANTHROPIC_API_KEY opzionale: analisi AI giornaliera con Claude Opus 5.5

name: HLX Watch

on:
  schedule:
    - cron: "7,37 * * * *"     # minuti "strani": GitHub li serve con più regolarità di 0 e 30
  workflow_dispatch:
    inputs:
      backfill_months:
        description: "Mesi di backfill da eseguire (0 = solo scansione)"
        default: "0"
      test_notify:
        description: "Invia una notifica di prova a Discord/Telegram"
        type: boolean
        default: false
      analyze:
        description: "Esegui subito l'analisi AI (anche senza novità)"
        type: boolean
        default: false
      send_report:
        description: "Invia subito il report delle ultime 24 ore"
        type: boolean
        default: false

concurrency:
  group: hlx-watch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write     # per salvare/ripristinare la cache del database
  pages: write       # per pubblicare la dashboard statica su GitHub Pages
  id-token: write

env:
  HLXWATCH_CONFIG: config.actions.yaml
  GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ripristina il database dall'ultimo run
        id: db
        uses: actions/cache/restore@v4
        with:
          path: data/hlxwatch.sqlite
          key: hlxwatch-db-${{ github.run_id }}
          restore-keys: hlxwatch-db-

      - name: Backfill iniziale (solo se il database non esiste o se richiesto a mano)
        if: steps.db.outputs.cache-matched-key == '' || (github.event_name == 'workflow_dispatch' && github.event.inputs.backfill_months != '0')
        run: |
          MONTHS="${{ github.event.inputs.backfill_months || '6' }}"
          if [ "$MONTHS" = "0" ]; then MONTHS=6; fi
          python -m hlxwatch backfill --months "$MONTHS"

      - name: Riapplica le regole attuali all'archivio (dopo modifiche al config)
        run: python -m hlxwatch reevaluate

      - name: Notifica di prova
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_notify == 'true'
        run: python -m hlxwatch test-notify

      - name: Scansione + report giornaliero se è ora
        run: python -m hlxwatch cron

      - name: Analisi AI su richiesta
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.analyze == 'true'
        run: python -m hlxwatch analyze --send

      - name: Report delle ultime 24 ore su richiesta
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.send_report == 'true'
        run: python -m hlxwatch report --hours 24 --send

      - name: Salva il database per il prossimo run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/hlxwatch.sqlite
          key: hlxwatch-db-${{ github.run_id }}

      - name: Pubblica database e report come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hlxwatch-data
          path: |
            data/hlxwatch.sqlite
            data/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Genera la dashboard statica
        run: python -m hlxwatch site --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: watch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
