# ============================================================
#  HLX Watch - configurazione di esempio
#  Copia questo file in config.yaml e adattalo.
#  I segreti (token GitHub, webhook Discord, bot Telegram) vanno in .env
# ============================================================

general:
  timezone: Europe/Rome                  # fuso di chi legge: ora del report e orari mostrati (i dati restano in UTC)
  data_dir: ./data                       # database, log, report, snapshot
  db_path: ./data/hlxwatch.sqlite
  log_level: INFO
  scan_interval_minutes: 45              # 30-60 consigliato
  daily_report_time: "09:00"             # ora del report giornaliero, nel fuso indicato sopra
  notify_min_score: 50                   # soglia punteggio per le notifiche
  notify_max_items: 25                   # max voci per notifica (per gioco)
  context_lines: 2                       # righe di contesto salvate attorno a ogni match
  max_findings_per_file: 400             # protezione dal rumore su file giganteschi

github:
  api_url: https://api.github.com
  raw_url: https://raw.githubusercontent.com
  initial_days: 7                        # alla prima scansione (senza backfill) guarda indietro di N giorni
  max_commits_per_run: 50                # protezione: commit massimi per repo per scansione
  max_file_pages: 10                     # GitHub espone al massimo 3000 file per commit (10 pagine da 300)
  fallback_max_bytes: 26214400           # 25 MB: file più grandi non vengono scaricati per il diff manuale
  fallback_workers: 8                    # download paralleli per i file senza patch (commit da migliaia di file)
  # estensioni considerate "testo" per il diff manuale quando GitHub non fornisce la patch
  text_extensions: [".txt", ".vdf", ".fgd", ".cfg", ".res", ".json", ".xml", ".kv3", ".vmt", ".md",
                    ".vcfg", ".vpc", ".ini", ".lua", ".nut", ".proto", ".csv", ".h", ".gi", ".vdata",
                    ".vsndevts", ".vpdi", ".vmap", ".vmdl", ".vmat", ".vpcf", ".vents", ".vsmart", ".vcompmat",
                    ".stringsignore"]
  ignore_path_patterns: []               # regex sui percorsi da ignorare, es. ["^Protobufs/"]
  # NOTA: l'organizzazione GitHub si chiamava SteamDatabase, ora è SteamTracking (il vecchio nome fa redirect)
  repos:
    - name: cs2
      title: "Counter-Strike 2"
      repo: SteamTracking/GameTracking-CS2
      branch: master
      appid: 730
      gamedir: csgo                      # cartella del gioco sotto game/ (binari, localizzazione)
    - name: dota2
      title: "Dota 2"
      repo: SteamTracking/GameTracking-Dota2
      branch: master
      appid: 570
      gamedir: dota
    - name: deadlock
      title: "Deadlock"
      repo: SteamTracking/GameTracking-Deadlock
      branch: master
      build_from_steam_inf: true         # Steam in anonimo non mostra le build: si leggono da steam.inf
      build_score: 45                    # anche 3-5 build al giorno: nel report e sul sito, senza notifica (50+ = notifica)
      appid: 1422450
      gamedir: citadel
      loc_prefix_score: 45               # ogni eroe nuovo porta ~1900 testi col suo nome: sul sito, senza notifica
    - name: alyx
      title: "Half-Life: Alyx"
      repo: SteamTracking/GameTracking-HalfLifeAlyx
      branch: master
      appid: 546560
      gamedir: hlvr
      ignore_keywords: [half_life, hl_universe]       # in un repo di Half-Life la parola è solo rumore
    - name: steamclient
      title: "Client Steam"
      repo: SteamTracking/SteamTracking
      branch: master
      ignore_keywords: [half_life, hl_universe]       # la UI di Steam cita i giochi Half-Life esistenti; "Half-Life 3" ha la sua regola
      # file del client Steam: stringhe, localizzazione, flag di funzionalità (Deadlock vi comparve prima dell'annuncio)
    - name: protobufs
      title: "Protobuf Steam"
      repo: SteamTracking/Protobufs
      branch: master
      # messaggi di rete e Game Coordinator di Steam e dei giochi Valve
    - name: steamvr
      title: "SteamVR"
      repo: SteamTracking/GameTracking-SteamVR
      branch: master
      # runtime VR: eventuale componente VR di hlx
      ignore_keywords: [hl_universe]
    - name: steamworks
      title: "Documentazione Steamworks"
      repo: SteamTracking/SteamworksDocumentation
      branch: master
      ignore_keywords: [half_life, hl_universe]       # cita spesso i giochi Half-Life esistenti; "Half-Life 3" resta coperto
      since: "2026-04-24T00:00:00Z"      # prima lettura: sei mesi di storia, poi solo i commit nuovi
      # funzioni nuove documentate per gli sviluppatori prima dell'uscita
    - name: steamhelp
      title: "Pagine di aiuto di Steam"
      repo: SteamTracking/SteamHelpTracking
      branch: main
      ignore_keywords: [half_life, hl_universe]
      since: "2026-04-24T00:00:00Z"
      # articoli di supporto, anche per prodotti non ancora usciti
    # Altri repo utili: SteamTracking/GameTracking-TF2

ai:
  enabled: true                          # serve ANTHROPIC_API_KEY (in .env o nei Secrets di GitHub)
  effort: high                           # profondità del ragionamento di Claude Opus 5.5
  monthly_budget_usd: 10                 # oltre questa spesa nel mese le analisi si fermano
  max_items: 60                          # novità passate al modello per ogni analisi
  generic_keywords: [npc, vehicle, weather, physics, half_life]   # voci fatte solo di queste: escluse (sotto 100 punti)

first_seen:
  enabled: true                          # data di prima comparsa delle voci "già presenti" (storia dei file su GitHub)
  max_downloads_per_run: 60              # versioni di file scaricate per run: il lavoro si completa in più run
  max_commit_pages: 20                   # fino a 2000 commit di storia per file

codenames:
  enabled: true                          # nomi di progetto mai visti dove Valve li scrive (mod != X, bug reporter, content/X,
                                         # rami di compilazione C:\buildworker\<ramo> nei dump delle DLL)
  score: 120                             # sopra la soglia alta: avviso immediato e voce in cronologia
  known: [csgo, cs2, dota, dota2, dota_lv, hlx, hlvr, "half-life vr", hl3, left4dead3, left4dead2_source2,
          rpg, citadel, core, "source 2 tools", steamvr, steampal,
          # rami di compilazione presenti oggi nei dump delle DLL (CS2, Dota 2, Deadlock, Alyx, SteamVR, client Steam)
          csgo_rel_win64, source2_dota_rel_2019_win64, citadel_rel_win64, sdr_public_win64, sdl3_win32,
          phonon_main_win64, steam_rel_client_win64, steam_rel_client_hotfix_win64, cef_win64]
  # i nomi presenti alla prima scansione completa vengono imparati senza avvisi (stato codenames:learned)

watched_files:                           # ogni riga aggiunta o tolta diventa una voce, anche senza parole chiave
  - pattern: "tools/bugreporter/config\\.txt$"
    title: "configurazione del bug reporter"
    score: 60
  - pattern: "(^|/)gameinfo\\.gi$"
    title: "gameinfo.gi (definizione del gioco)"
    score: 50

structure:                               # forma dei repository, senza parole chiave (una chiamata API per posto, a ogni run)
  enabled: true
  score: 100                             # cartella nuova sotto game/, depot nuovo in manifests/, cartella nuova nei Protobuf
  score_removed: 60                      # voce sparita: sopra la soglia di notifica, ma sotto la rilevanza alta
  # places: [{path: game, kind: dirs, title: "...", repos: games}]   repos = games | all | [nomi]; default nel codice

localization:                            # famiglie di token nei file *_english.txt (CSGO_, DOTA_, Citadel_, HLVR_...)
  enabled: true
  min_tokens: 20                         # una famiglia mai vista conta se porta almeno tanti testi in un commit
  score_new_file: 100                    # file di localizzazione nuovo: un progetto nuovo ha i suoi file
  score_new_prefix: 60                   # famiglia nuova in un file esistente (i repository possono abbassarlo: loc_prefix_score)
  # le famiglie presenti vengono imparate alla prima scansione completa (stato locprefix:<gioco>)

archaeology:
  # giochi Source 2 dismessi, conservati da SteamTracking: solo per l'archeologia (comando `archeologia`),
  # non vengono seguiti nei controlli normali. Coprono gli anni del passaggio da HLVR a HLX.
  extra_repos:
    - {name: underlords, title: "Dota Underlords", repo: SteamTracking/GameTracking-Underlords, branch: master}
    - {name: artifact, title: "Artifact", repo: SteamTracking/GameTracking-Artifact, branch: master}
    - {name: artifact_beta, title: "Artifact Foundry (beta)", repo: SteamTracking/GameTracking-Artifact-Beta, branch: master}
    - {name: dota2test, title: "Dota 2 Test", repo: SteamTracking/GameTracking-Dota2Test, branch: master}

timeline:
  enabled: true                          # pagina Cronologia HLX: indizi >= min_score raggruppati dall'AI
  min_score: 90                          # 90 e non 100: così entrano anche le righe hl3 (peso 90),
                                         # come "mod" "hl3" del 2018; l'AI scarta da sé le estensioni .hl3 dei salvataggi
  nascondi: []                           # id degli indizi da non mostrare (es. [t7])
  include_keywords: [hl2_achievement]    # voci sotto min_score da mostrare comunque come contesto
  rilevanza: {}                          # correzioni a mano, es. {t5: alta}
  correzioni:                            # testo o rilevanza corretti a mano (l'AI si può sbagliare)
    t17:
      rilevanza: bassa
      spiegazione: "Nelle stringhe del motore Source 2 compaiono percorsi come 'save/%s.hl3' e '//mod/%s.HL3'. Non riguardano Half-Life 3: fin da Half-Life 1 e Half-Life 2 i salvataggi del motore Source usano i file .hl1, .hl2 e .hl3 per lo stato dei livelli attraversati, e Source 2 ha ereditato quei nomi. È un residuo del formato dei salvataggi, presente almeno dal 2016 in tutti i giochi."

weekly:
  enabled: true                          # riepilogo della settimana su Telegram, il lunedì dopo il report

health:
  enabled: true                          # avvisi su Telegram quando qualcosa si ferma, e quando riparte
  failure_threshold: 3                   # run di fila con errori prima dell'avviso (credito AI esaurito: subito)
  stale_days: 5                          # avviso se SteamTracking non pubblica commit da tanti giorni

repo_discovery:
  enabled: true                          # a ogni run elenca i repository dell'organizzazione e avvisa dei nuovi
  org: SteamTracking
  auto_follow: true                      # i nuovi GameTracking-* vengono seguiti da soli, dalla data di creazione
  base_score: 70                         # punteggio di un repository nuovo (sopra la soglia: avviso su Telegram)

full_scan:
  enabled: true
  interval_hours: 24                     # una scansione completa al giorno (le altre esecuzioni la saltano)
  min_score: 50                          # registra solo le righe con punteggio almeno 50
  # termini (regex estesa, senza distinzione maiuscole) che selezionano le righe da valutare:
  # solo parole ad alto valore, le generiche come npc_ darebbero migliaia di righe
  prefilter: "hlx|hl3|half[ _-]?life|left[ _-]?4[ _-]?dead|l4d3"
  exclude_repos: []                      # nomi dei repo da non scansionare
  max_findings_per_repo: 2000

steam:
  enabled: true
  worker_timeout_seconds: 240            # il login anonimo PICS gira in un sottoprocesso isolato
  build_score: 55                        # punteggio di una nuova build (>= notify_min_score = notifica)
  watch_apps:
    - {appid: 730,     name: cs2,      title: "Counter-Strike 2"}
    - {appid: 570,     name: dota2,    title: "Dota 2"}
    - {appid: 1422450, name: deadlock, title: "Deadlock"}
    - {appid: 546560,  name: alyx,     title: "Half-Life: Alyx", ignore_keywords: [half_life, hl_universe]}
  # NOTA: Deadlock (1422450) in anonimo espone solo info parziali (depot e build richiedono un token):
  # viene comunque seguito tramite il repo GameTracking-Deadlock.
  new_apps:
    enabled: true
    # Lista completa delle app via IStoreService/GetAppList: serve una chiave Web API gratuita in .env
    # (STEAM_WEB_API_KEY, da https://steamcommunity.com/dev/apikey). Senza chiave si usa solo l'euristica
    # sugli appid: un appid mai visto e più alto della "frontiera" registrata è considerato un'app nuova.
    applist_refresh_hours: 24            # con la chiave: ricarica la lista completa al massimo una volta al giorno
    max_lookup_per_run: 300              # nuove app di cui chiedere i dettagli a PICS per scansione
    flag_developers: ["Valve"]           # developer/publisher che fanno scattare l'allarme
    flag_name_patterns: ["hlx", "half[- _]?life", "hl3", "untitled", "unnamed", "source ?2", "test ?app", "valve"]
    score_developer: 90
    score_name: 120
    score_private: 25                    # app nuova ma con info non visibili in anonimo

local:
  enabled: false
  source2viewer_cli: "C:/Tools/Source2Viewer-CLI/Source2Viewer-CLI.exe"
  text_extensions: "vdf,txt,fgd,kv3,cfg,res,vcfg,vmt,json,xml,gi"
  extract_text_files: true               # oltre alla lista dei file, estrae e confronta i file di testo
  min_string_length: 6                   # per l'estrazione stringhe dai binari
  games:
    - name: cs2
      title: "Counter-Strike 2"
      vpks:
        - "C:/Program Files (x86)/Steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/pak01_dir.vpk"
      binaries:
        - "C:/Program Files (x86)/Steam/steamapps/common/Counter-Strike Global Offensive/game/bin/win64/engine2.dll"
        - "C:/Program Files (x86)/Steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/bin/win64/client.dll"
        - "C:/Program Files (x86)/Steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/bin/win64/server.dll"

notifiers:
  discord:
    enabled: false                       # URL in .env -> DISCORD_WEBHOOK_URL
    username: "HLX Watch"
  telegram:
    enabled: false                       # TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID in .env
  webpush:
    enabled: false                        # notifiche di sistema per chi le attiva sul sito (PUSH_SECRET in .env)
    worker_url: "https://hlx-watch-bot.bryan-oberholzer00.workers.dev"

dashboard:
  host: 127.0.0.1
  port: 8765

# ------------------------------------------------------------
#  Parole chiave. Ogni voce: id, pattern (regex, case-insensitive), weight, excludes (opzionale)
#  Punteggio di una riga = peso più alto + 25% dei pesi degli altri match + bonus.
#  Soglie: high >= 100, medium >= 50.
#  NOTA: "citadel" NON è HLX (è il nome in codice di Deadlock): è in global_excludes,
#  che scarta la riga a meno che non contenga anche un match "alto" (es. hlx).
# ------------------------------------------------------------
keywords:
  severity: {high: 100, medium: 50}
  bonus_min_weight: 40  # i bonus qui sotto valgono solo per parole chiave con peso almeno 40
  bonuses:
    new_file: 20          # file aggiunto
    removed_file: 10
    fgd_entity: 25        # nuova classe entità in un .fgd
    convar: 15            # riga in un file di convar / cvar
    path: 15              # il match è in un percorso (maps/, models/, scripts/...)
  global_excludes: ["citadel"]
  codename_weight: 30
  codenames: []           # nomi in codice sconosciuti da sorvegliare, come parole intere (es. ["hlvr2"]); "tf" è Team Fortress ovunque
  items:
    - id: hlx_class
      # Valve chiama le classi col prefisso del progetto (CCitadelPlayerPawn, CDOTA_...): CHLXPlayerPawn
      # non ha "hlx" separato dalle lettere, quindi serve una regola a parte, sensibile alle maiuscole
      pattern: "(?<![A-Za-z0-9])C_?HLX(?=[A-Z_])"
      case_sensitive: true
      weight: 115
      description: "classi C++ del progetto HLX (CHLXPlayer, CHLX_Foo, C_HLX_Bar)"
    - id: hlx_fused
      # HLX attaccato ad altre lettere, nei due modi in cui Valve lo scrive nell'editor Hammer:
      # in mezzo a un nome di classe a gobba di cammello (CDummyHLXCover) e come nome minuscolo di un
      # helper dell'editor (hlxcoverpreview). Provata il 2026-10-29 sui quattro giochi: prende solo queste
      # due righe, non "shlx" (istruzione del processore) né i frammenti casuali dei dump di Deadlock
      pattern: "(?<![A-Za-z0-9])hlx(?=[a-z]{4,}(?![A-Za-z0-9]))|(?<=[a-z])HLX(?=[A-Z][a-z]{2,}(?:[A-Z][a-z]+)*(?![A-Za-z0-9]))"
      case_sensitive: true
      weight: 110
      description: "HLX dentro un nome (CDummyHLXCover, hlxcoverpreview)"
    - id: hlx
      pattern: "(?<![a-z0-9])hlx(?![a-z0-9])"
      weight: 100
      description: "hlx come parola isolata"
      excludes: ["hlx_kill_"]            # obiettivi HLX_* di Half-Life 2 (vedi hl2_achievement)
    - id: hlx_prefix
      pattern: "(?<![a-z0-9])hlx_[a-z0-9_]+"
      weight: 110
      description: "identificatori hlx_* (ConVar, variabili, file)"
      excludes: ["hlx_kill_"]
    - id: hl2_achievement
      pattern: "(?<![a-z0-9])hlx_kill_[a-z0-9_]+"
      weight: 30
      description: "obiettivi HLX_KILL_* di Half-Life 2 e degli Episodi (2007): il prefisso HLX esisteva già, non è un gioco nuovo"
    - id: hlx_path
      pattern: "(maps|models|scripts|materials|sounds|particles|resource|scenes|soundevents|panorama|cfg|animations|weapons|characters)[/\\\\]hlx"
      weight: 130
      description: "percorsi tipo maps/hlx, models/hlx"
    - id: hl3
      pattern: "(?<![a-z0-9])hl3(?![a-z0-9])"
      weight: 90
      description: "hl3"
    - id: half_life_3
      pattern: 'half[_ -]?life[_ -]?(3|three|iii)(?![a-z0-9])'
      weight: 120
      description: "Half-Life 3 per esteso (testi, localizzazione, nomi app)"
    - id: half_life
      pattern: "half[_\\- ]?life"
      weight: 40
      description: "half-life generico (rumoroso)"
      excludes: ["alyx", "half-life 2", "half_life_2", "half-life2", "hl2", "episode", "halflife2"]
    - id: hl_universe
      # creature, armi, luoghi e personaggi di Half-Life nei file condivisi di CS2, Dota 2 e Deadlock
      # (esclusa Alyx). 45 punti: sotto la soglia di notifica, ma un'entità FGD o un file nuovo la superano.
      pattern: "(?<![a-z0-9])(antlions?|headcrabs?|vortigaunts?|manhacks?|hopper[ _]?mines?|houndeyes?|bullsquids?|nihilanth|zombine|combine[ _](soldier|elite|guard|metrocop|gunship|dropship|strider|barrier|overwatch|citadel)|npc_combine[a-z0-9_]*|npc_strider|npc_citizen[a-z0-9_]*|npc_antlion[a-z0-9_]*|npc_headcrab[a-z0-9_]*|npc_zombie[a-z0-9_]*|gravity[ _]?gun|hev[ _]?suit|crowbar|black[ _]?mesa|city[ _]?17|nova[ _]?prospekt|ravenholm|gordon[ _]freeman|g[ _-]?man(?![a-z])|xen(?![a-z0-9]))"
      weight: 45
      description: "universo Half-Life nel motore condiviso"
      excludes: ["hlx_kill_"]            # gli obiettivi HLX_KILL_* di Half-Life 2 restano a 30 punti
      # cosmetici, traduzioni, elenchi di file e dump di librerie esterne: lì queste parole sono normali
      path_excludes: ["items_game\\.txt$", "csgo_english\\.txt$", "/localization/", "readonly_tools_asset_info", "pak01_dir\\.txt$", "^manifests/", "Qt5Core_strings", "nvngx_dlss_strings", "readme", "\\.md$"]
    - id: l4d3
      pattern: '(?<![a-z0-9])(left[ _-]?4[ _-]?dead[ _-]?3|l4d3)(?![a-z0-9])'
      weight: 60
      description: "Left 4 Dead 3 (progetto Source 2 noto dal 2015): avviso se compare oltre al bug reporter"
    - id: npc
      pattern: "(?<![a-z0-9])(npc_[a-z0-9_]+|ai_basenpc|cai_basenpc|ai_base_npc)"
      weight: 15
      description: "classi NPC / AI"
      path_excludes: ["/particles/econ/", "npc_dota_hero_", "/dota/pak01_dir/scripts/npc/", "/dota_addons/"]   # cosmetici ed eroi di Dota
    - id: vehicle
      pattern: "(?<![a-z0-9])(prop_vehicle[a-z0-9_]*|vehicle_[a-z0-9_]+)"
      weight: 12
      description: "veicoli"
      path_excludes: ["/particles/econ/", "npc_dota_hero_", "/dota/pak01_dir/scripts/npc/", "/dota_addons/"]   # cosmetici ed eroi di Dota
    - id: weather
      pattern: "(?<![a-z0-9])(wind_[a-z0-9_]+|weather_[a-z0-9_]+|thermodynamic[a-z]*|thermal_[a-z0-9_]+|heat_?sim[a-z0-9_]*)"
      weight: 12
      description: "vento / meteo / termodinamica"
      path_excludes: ["/particles/econ/", "npc_dota_hero_", "/dota/pak01_dir/scripts/npc/", "/dota_addons/"]   # cosmetici ed eroi di Dota
    - id: physics
      pattern: "(?<![a-z0-9])(phys_[a-z0-9_]+|rubikon[a-z0-9_]*)"
      weight: 6
      description: "fisica (molto generico)"
      path_excludes: ["/particles/econ/", "npc_dota_hero_", "/dota/pak01_dir/scripts/npc/", "/dota_addons/"]   # cosmetici ed eroi di Dota
