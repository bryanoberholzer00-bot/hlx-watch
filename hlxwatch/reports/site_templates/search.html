{% extends "base.html" %}
{% block title %}Ricerca - HLX Watch{% endblock %}
{% block content %}
<h1>Ricerca nello storico</h1>
<section>
<form class="filters" id="filters" onsubmit="return false">
 <label>Testo / token / file <input id="q" placeholder="hlx_" size="28"></label>
 <label>Gioco <select id="game"><option value="">tutti</option>
  {% for g in games %}<option value="{{ g }}">{{ titles.get(g, g) }}</option>{% endfor %}</select></label>
 <label>Tipo <select id="type"><option value="">tutti</option>
  {% for c in ["added","removed","changed","present","file_added","file_removed","file_renamed","build","new_app","new_repo","codename","structure","localization","orphan","renamed","summary","pulse"] %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></label>
 <label>Area <select id="area"><option value="">tutte</option>
  {% for key, label in areas %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label>
 <label>Punteggio min <input id="min" type="number" value="0" style="width:5rem"></label>
 <label>Da <input id="since" type="date"></label>
 <label>A <input id="until" type="date"></label>
 <label>Ordina <select id="order"><option value="day">data</option><option value="score">punteggio</option></select></label>
 <label><span>Solo nuove</span><input id="new" type="checkbox"></label>
 <label title="Righe del codice condiviso da CS2, Dota 2 e Deadlock che gli altri due giochi non hanno mai avuto"><span>Solo in un gioco</span><input id="solo" type="checkbox"></label>
 <label title="In una riga sola: la stessa riga in più file, e le righe dello stesso commit e file (le tracce HLX restano sempre da sole)"><span>Raggruppa</span><input id="group" type="checkbox" checked></label>
</form>
<div class="kinds" id="kinds" role="group" aria-label="Tipo di traccia HLX">
 <span class="muted"><small>Tracce HLX:</small></span>
 <button type="button" data-k="" aria-pressed="true">Tutte le voci</button>
 <button type="button" data-k="hlx" aria-pressed="false">Solo HLX</button>
 <button type="button" data-k="gioco" aria-pressed="false" title="Armi, nemici, oggetti, intelligenza artificiale">🎮 Gioco</button>
 <button type="button" data-k="motore" aria-pressed="false" title="Grafica, suono, materiali, particelle, fisica">⚙️ Motore</button>
 <button type="button" data-k="alyx" aria-pressed="false" title="Vecchi nomi di Half-Life: Alyx con hlx al posto di hlvr">🔁 Da Alyx</button>
 <button type="button" data-k="strumenti" aria-pressed="false" title="Strumenti di lavoro di Valve (segnalazione dei bug): il progetto esiste, ma non dicono a che punto è">🛠️ Strumenti</button>
 <button type="button" data-k="dubbio" aria-pressed="false" title="Il nome non dice se è gioco o motore">❔ Da capire</button>
</div>
<p class="muted" id="status">Carico i dati…</p>
<table id="results">
 <thead><tr><th>Punti</th><th>Data modifica</th><th>Gioco</th><th>Tipo</th><th>Token / stringa</th><th>File</th><th>Keyword</th></tr></thead>
 <tbody></tbody>
</table>
<p><button id="more" type="button" hidden>Mostra altre 100</button></p>
</section>
<style>
 .kinds{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:.2rem 0 .6rem}
 .kinds button{background:var(--code);color:inherit;border:1px solid var(--line);padding:.3rem .65rem;border-radius:999px;font-size:.85rem}
 .kinds button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
 .kinds button small{opacity:.75}
 .kind{white-space:nowrap}
 .gruppo{margin-top:.4rem}
 .gruppo summary{display:inline-block;cursor:pointer;font-size:.8rem;padding:.2rem .65rem;border:1px solid var(--accent);
  border-radius:999px;color:var(--accent);background:var(--code);list-style:none;user-select:none}
 .gruppo summary::-webkit-details-marker{display:none}
 .gruppo summary::before{content:"▸ ";} .gruppo[open] summary::before{content:"▾ ";}
 .gruppo summary:hover{background:var(--accent);color:#fff}
 .gruppo[open] .apri{display:none} .gruppo:not([open]) .chiudi{display:none}
 .gruppo ul{list-style:none;padding:0;margin:.3rem 0 0} .gruppo li{margin:.25rem 0;font-size:.85rem}
 .gruppo .badge{font-size:.7rem;padding:0 .35rem}
 /* sul telefono ogni risultato diventa una scheda: sette colonne in 375 pixel non si leggono */
 @media(max-width:700px){
  #results thead{display:none} #results,#results tbody,#results tr,#results td{display:block;width:auto}
  #results tr{border:1px solid var(--line);border-radius:8px;margin:.5rem 0;padding:.35rem .5rem;border-left-width:4px}
  #results td{border:0;padding:.12rem 0} #results td[data-l]::before{content:attr(data-l) " ";color:var(--muted);font-size:.72rem}
  #results td:first-child{float:right;margin-left:.4rem}
 }
</style>
<script>
const TITLES = {{ titles|tojson }};
const AREAS = Object.fromEntries({{ areas|tojson }});
const PAGE = 100;                // risultati per volta: 400 righe insieme pesano troppo sul telefono
let MAX_ROWS = PAGE;
let ALL = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sev = s => s >= 100 ? "high" : s >= 50 ? "medium" : "low";
// tipo delle tracce HLX (fase.py): gli stessi simboli degli avvisi su Telegram
const KINDS = {gioco: "🎮 pezzo di gioco", motore: "⚙️ pezzo di motore", alyx: "🔁 eredità di Alyx",
               strumenti: "🛠️ strumenti di lavoro", dubbio: "❔ tipo da capire"};
let KIND = "";
const kindOk = (r, k) => !k || (k === "hlx" ? !!r.k : r.k === k);
function setKind(k) {
  KIND = k;
  for (const b of document.querySelectorAll("#kinds button")) b.setAttribute("aria-pressed", String(b.dataset.k === k));
}

function readParams() {
  const p = new URLSearchParams(location.search);
  if (p.get("q")) $("q").value = p.get("q");
  if (p.get("game")) $("game").value = p.get("game");
  if (p.get("type")) $("type").value = p.get("type");
  if (p.get("min")) $("min").value = p.get("min");
  if (p.get("new")) $("new").checked = true;
  if (p.get("solo")) $("solo").checked = true;
  if (p.get("order")) $("order").value = p.get("order");
  if (p.get("area")) $("area").value = p.get("area");
  if (p.get("since")) $("since").value = p.get("since");
  if (p.get("until")) $("until").value = p.get("until");
  if (p.get("k") && (p.get("k") === "hlx" || KINDS[p.get("k")])) setKind(p.get("k"));
}

function groupRows(rows) {
  const map = new Map();
  for (const r of rows) {
    const key = ((r.token || r.text).toLowerCase()) + "|" + r.ref + "|" + r.type;
    const g = map.get(key);
    if (g) { g.dup += 1; g.files.push(r.file); g.score = Math.max(g.score, r.score); g.new = g.new || r.new; }
    else map.set(key, Object.assign({dup: 1, files: []}, r));
  }
  return [...map.values()];
}

// Le righe dello stesso commit, file e giorno (es. dodici impostazioni nuove nello stesso gameinfo.gi) diventano una:
// in vista la voce con il punteggio più alto, le altre sotto "+ altre N righe". Le tracce HLX e quelle con una scheda
// restano sempre da sole, per non nasconderle. Il giorno serve per le fonti senza commit vero (hwid:SDL:S...).
function bundleRows(rows) {
  const out = [], groups = new Map();
  for (const r of rows) {
    if (r.k || r.tc || !r.ref) { out.push([r]); continue; }
    const key = r.ref + "|" + r.file + "|" + r.day;
    let g = groups.get(key);
    if (!g) { g = []; groups.set(key, g); out.push(g); }
    g.push(r);
  }
  return out.map(g => {
    if (g.length === 1) return g[0];
    const top = g.reduce((a, b) => (b.score > a.score ? b : a));
    return Object.assign({}, top, {rel: g.filter(r => r !== top), new: g.some(r => r.new)});
  });
}

function relHtml(r) {
  const n = r.rel.length;
  return `<details class="gruppo"><summary><span class="apri">Mostra</span><span class="chiudi">Nascondi</span> ${n === 1 ? "un'altra riga" : `altre ${n} righe`} dello stesso commit e file</summary><ul>` +
    r.rel.map(x => `<li><span class="badge ${sev(x.score)}">${x.score}</span> ${x.type !== r.type ? `<small class="muted">${esc(x.type)}</small> ` : ""}` +
      `<code>${esc((x.token || x.text).slice(0, 80))}</code>${x.new ? ' <span class="new">mai vista prima</span>' : ""}</li>`).join("") +
    "</ul></details>";
}

// stesso testo di links.duplicates_label: altri file dello stesso commit, oppure altre righe dello stesso file
function dupLabel(r) {
  const files = new Set(r.files.filter(f => f !== r.file)).size, lines = r.files.filter(f => f === r.file).length;
  const parts = [];
  if (files) parts.push(files > 1 ? `+ altri ${files} file nello stesso commit` : "+ un altro file nello stesso commit");
  if (lines) parts.push(lines > 1 ? `+ altre ${lines} righe nello stesso file` : "+ un'altra riga nello stesso file");
  return parts.join(", ");
}

function render() {
  const q = $("q").value.trim().toLowerCase(), game = $("game").value, type = $("type").value, area = $("area").value;
  const min = parseInt($("min").value || "0", 10), since = $("since").value, until = $("until").value;
  const onlyNew = $("new").checked, onlySolo = $("solo").checked, order = $("order").value;
  let base = ALL.filter(r => r.score >= min
    && (!game || r.game === game) && (!type || r.type === type) && (!area || r.area === area) && (!onlyNew || r.new) && (!onlySolo || r.so)
    && (!since || r.day >= since) && (!until || r.day <= until)
    && (!q || (r.token || "").toLowerCase().includes(q) || r.text.toLowerCase().includes(q) || r.file.toLowerCase().includes(q)));
  // quante voci per tipo, con gli altri filtri già applicati
  for (const b of document.querySelectorAll("#kinds button")) {
    const n = base.filter(r => kindOk(r, b.dataset.k)).length;
    b.innerHTML = b.innerHTML.replace(/ <small>.*<\/small>$/, "") + ` <small>${n}</small>`;
  }
  let rows = base.filter(r => kindOk(r, KIND));
  rows.sort(order === "score" ? (a, b) => b.score - a.score || (b.day > a.day ? 1 : -1) : (a, b) => (b.day > a.day ? 1 : b.day < a.day ? -1 : b.id - a.id));
  const total = rows.length;
  // con un testo da cercare ogni riga trovata resta in vista: si accorpano solo le righe uguali in più file
  if ($("group").checked) rows = q ? groupRows(rows) : bundleRows(groupRows(rows));
  const shown = rows.slice(0, MAX_ROWS);
  $("status").textContent = `${total} voci` + ($("group").checked ? ` (${rows.length} righe raggruppate)` : "") + (rows.length > MAX_ROWS ? `, mostro le prime ${MAX_ROWS}` : "");
  const left = rows.length - shown.length;
  $("more").hidden = left <= 0;
  $("more").textContent = `Mostra altre ${Math.min(PAGE, left)}`;
  $("results").querySelector("tbody").innerHTML = shown.map(r => `
   <tr class="${sev(r.score)}">
    <td><span class="badge ${sev(r.score)}">${r.score}</span></td>
    <td data-l="Data:">${r.al ? '<small class="muted">almeno dal</small><br>' : ""}${esc(r.day)}${r.new ? '<br><span class="new" title="La riga non era mai comparsa nell\'archivio, che parte dal 2016">mai vista prima</span>' : ""}<br><small class="muted">vista ${esc(r.seen)}</small></td>
    <td data-l="Gioco:">${esc(TITLES[r.game] || r.game)}<br><small class="muted">${esc(r.source)}</small></td>
    <td data-l="Tipo:">${r.k ? `<span class="kind">${KINDS[r.k]}</span><br>` : ""}${esc(r.type)}<br><small class="muted">${esc(AREAS[r.area] || "")}</small>${r.ev && r.ev !== "altro" ? `<br><small title="Tipo di prova">prova: ${esc(r.ev)}</small>` : ""}${r.fm ? `<br><small class="muted" title="La stessa riga è comparsa anche in questi giochi entro 60 giorni: viaggia con il codice condiviso di Source 2, non indica lavoro nuovo su questo gioco">fusione del motore: anche in ${esc(r.fm.map(g => TITLES[g] || g).join(", "))}</small>` : ""}${r.so ? `<br><small class="solo" title="La riga è nel codice che CS2, Dota 2 e Deadlock condividono, ma gli altri due giochi non l'hanno mai avuta: è lavoro su questo gioco, non codice comune in viaggio. Se arriva più tardi anche negli altri, diventa una fusione del motore">solo in ${esc(TITLES[r.game] || r.game)}</small>` : ""}</td>
    <td><code>${esc((r.token || r.text).slice(0, 80))}</code>${r.token && r.text !== r.token ? `<br><small class="muted">${esc(r.text.slice(0, 120))}</small>` : ""}${r.tc ? `<br><a href="traccia-${esc(r.tc)}.html"><small>scheda della traccia</small></a>` : ""}${r.rel ? relHtml(r) : ""}</td>
    <td data-l="File:"><small>${esc(r.file.slice(0, 90))}${r.line ? ":" + r.line : ""}</small>
        ${r.dup > 1 ? `<br><small class="muted" title="${esc(r.files.join("\n"))}">${dupLabel(r)}</small>` : ""}
        ${r.url ? `<br><a href="${esc(r.url)}"><small>${esc(r.ul || "commit")}${r.ul === "commit" ? " " + esc(r.ref.slice(0, 8)) : ""}</small></a>` : ""}
        ${r.sx ? `<br><a href="${esc(r.sx)}" title="Campi e opzioni della classe nello Schema Explorer di s2v.app"><small>vedi la classe</small></a>` : ""}</td>
    <td data-l="Parole chiave:"><small>${esc((r.kw || []).join(", "))}</small></td>
   </tr>`).join("");
}

readParams();
fetch("findings.json").then(r => r.json()).then(data => { ALL = data; render(); })
  .catch(e => { $("status").textContent = "Impossibile caricare findings.json: " + e; });
for (const el of document.querySelectorAll("#filters input, #filters select"))
  el.addEventListener("input", () => { MAX_ROWS = PAGE; render(); });     // filtro nuovo: si riparte dai primi 100
$("more").addEventListener("click", () => { MAX_ROWS += PAGE; render(); });
for (const b of document.querySelectorAll("#kinds button"))
  b.addEventListener("click", () => { setKind(b.dataset.k); MAX_ROWS = PAGE; render(); });
</script>
{% endblock %}
