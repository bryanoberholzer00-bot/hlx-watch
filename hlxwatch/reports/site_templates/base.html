<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HLX Watch{% endblock %}</title>
<style>
 :root{--accent:#e8743b;--bg:#f6f7f9;--card:#fff;--line:#e2e5ea;--muted:#6b7280;--text:#1f2937;--th:#f0f2f5;--code:#eef0f3;--hover:#fafbfc;color-scheme:light dark}
 @media (prefers-color-scheme: dark){:root{--bg:#15181e;--card:#1f2430;--line:#323847;--muted:#9aa3b2;--text:#e5e7eb;--th:#272d3a;--code:#2b3140;--hover:#242a37}}
 *{box-sizing:border-box} body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
 header{background:#1f2430;color:#fff;padding:.7rem 1.2rem;display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
 header a{color:#fff;text-decoration:none;opacity:.85} header a:hover{opacity:1} header .brand{font-weight:700;color:var(--accent);font-size:1.1rem}
 main{max-width:1250px;margin:1.2rem auto;padding:0 1rem}
 .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.2rem}
 .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem} .card b{display:block;font-size:1.6rem}
 .card span{color:var(--muted);font-size:.85rem}
 section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:1.2rem;overflow-x:auto}
 h1{font-size:1.4rem;margin:.2rem 0 1rem} h2{font-size:1.1rem;margin:0 0 .8rem}
 table{border-collapse:collapse;width:100%;font-size:.88rem} th,td{border-bottom:1px solid var(--line);padding:.4rem .5rem;text-align:left;vertical-align:top}
 th{background:var(--th)} tr:hover td{background:var(--hover)}
 code{background:var(--code);padding:0 .3rem;border-radius:3px;word-break:break-all;font-size:.85em}
 a{color:#3b82f6} svg.timeline text{fill:var(--text)}
 @media(max-width:700px){
  main{padding:0 .5rem} section{padding:.6rem} table{font-size:.78rem} th,td{padding:.3rem .3rem}
  header{gap:.7rem;font-size:.85rem} header span{display:none} .cards{grid-template-columns:repeat(2,1fr)} .card b{font-size:1.2rem}
  td small{font-size:.72rem}
 }
 .high{border-left:4px solid #e53935} .medium{border-left:4px solid #fb8c00} .low{border-left:4px solid #b0bec5}
 .badge{display:inline-block;min-width:2.6rem;text-align:center;padding:.1rem .4rem;border-radius:4px;color:#fff;font-weight:600;font-size:.8rem}
 .badge.high{background:#e53935} .badge.medium{background:#fb8c00} .badge.low{background:#90a4ae}
 .muted{color:var(--muted)} .new{color:#2e7d32;font-weight:600}
 form.filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem}
 form.filters label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted)}
 input,select{padding:.35rem .5rem;border:1px solid var(--line);border-radius:5px;font-size:.9rem;background:var(--card);color:var(--text)}
 button{background:var(--accent);color:#fff;border:0;padding:.45rem .9rem;border-radius:5px;cursor:pointer}
 svg.timeline{width:100%;height:auto;background:var(--card)}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem} @media(max-width:900px){.grid2{grid-template-columns:1fr}}
 footer{color:var(--muted);font-size:.8rem;text-align:center;margin:2rem 0}
</style>
</head>
<body>
<header>
 <a class="brand" href="index.html">HLX Watch</a>
 <a href="search.html">Ricerca</a>
 <a href="search.html?min=100">Alta rilevanza</a>
 <a href="search.html?new=1&min=50">Nuove</a>
 <a href="reports/report-1d.html">Report oggi</a>
 <a href="reports/report-7d.html">7 giorni</a>
 <a href="reports/report-30d.html">30 giorni</a>
 <span class="muted" style="margin-left:auto;font-size:.8rem">aggiornato {{ generated }}</span>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>HLX Watch v{{ version }} &middot; dati pubblici da SteamTracking/GameTracking-* e Steam PICS</footer>
</body>
</html>
