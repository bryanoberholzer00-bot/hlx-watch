<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HLX Watch{% endblock %}</title>
<style>
 :root{--accent:#e8743b;--bg:#f6f7f9;--card:#fff;--line:#e2e5ea;--muted:#6b7280}
 *{box-sizing:border-box} body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#1f2937}
 header{background:#1f2430;color:#fff;padding:.7rem 1.2rem;display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap}
 header a{color:#fff;text-decoration:none;opacity:.85} header a:hover{opacity:1} header .brand{font-weight:700;color:var(--accent);font-size:1.1rem}
 main{max-width:1250px;margin:1.2rem auto;padding:0 1rem}
 .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.2rem}
 .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem} .card b{display:block;font-size:1.6rem}
 .card span{color:var(--muted);font-size:.85rem}
 section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:1.2rem}
 h1{font-size:1.4rem;margin:.2rem 0 1rem} h2{font-size:1.1rem;margin:0 0 .8rem}
 table{border-collapse:collapse;width:100%;font-size:.88rem} th,td{border-bottom:1px solid var(--line);padding:.4rem .5rem;text-align:left;vertical-align:top}
 th{background:#f0f2f5;position:sticky;top:0} tr:hover td{background:#fafbfc}
 code{background:#eef0f3;padding:0 .3rem;border-radius:3px;word-break:break-all;font-size:.85em}
 .high{border-left:4px solid #e53935} .medium{border-left:4px solid #fb8c00} .low{border-left:4px solid #b0bec5}
 .badge{display:inline-block;min-width:2.6rem;text-align:center;padding:.1rem .4rem;border-radius:4px;color:#fff;font-weight:600;font-size:.8rem}
 .badge.high{background:#e53935;border:0} .badge.medium{background:#fb8c00;border:0} .badge.low{background:#90a4ae;border:0}
 .muted{color:var(--muted)} .new{color:#2e7d32;font-weight:600}
 form.filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem}
 form.filters label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted)}
 input,select{padding:.35rem .5rem;border:1px solid var(--line);border-radius:5px;font-size:.9rem}
 button{background:var(--accent);color:#fff;border:0;padding:.45rem .9rem;border-radius:5px;cursor:pointer}
 pre{background:#1f2430;color:#e5e7eb;padding:.8rem;border-radius:6px;overflow:auto;font-size:.8rem;white-space:pre-wrap}
 svg.timeline{width:100%;height:auto;background:#fff} .pager{display:flex;gap:1rem;margin-top:1rem}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem} @media(max-width:900px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
 <a class="brand" href="/">HLX Watch</a>
 <a href="/findings">Ricerca</a>
 <a href="/findings?min_score=100">Alta rilevanza</a>
 <a href="/findings?only_new=1&min_score=50">Nuove</a>
 <a href="/builds">Build</a>
 <a href="/apps">App Steam</a>
 <a href="/report?days=1">Report oggi</a>
 <a href="/report?days=7">Report 7gg</a>
 <span class="muted" style="margin-left:auto;font-size:.8rem">v{{ version }}</span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
